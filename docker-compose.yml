name: wheels

services:
  backend:
    build: ./backend
    image: wheels-backend:dev
    ports:
      - "${PUERTO_BACKEND:-3000}:3000"
    environment:
      PORT: 3000
      RUTA_BD: /app/datos/wheels.db
    volumes:
      # La base de datos SQLite sobrevive a "docker compose down"; "down -v" la borra
      - datos-wheels:/app/datos
    restart: unless-stopped

volumes:
  datos-wheels:
