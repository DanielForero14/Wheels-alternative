name: CI

# Integración continua de WHEELS: construcción, reglas de la arquitectura hexagonal,
# pruebas unitarias (con el umbral de cobertura del dominio), pruebas de integración y la app móvil.
# Cada job es un check del Pull Request: si alguno falla, el cambio no se puede fusionar a main.
#
# Cuándo corre:
#   - en cada push a cualquier rama distinta de main y en cada Pull Request hacia main;
#   - en main lo ejecuta cd.yml como primera etapa (workflow_call), antes de publicar y desplegar;
#   - a mano desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Mínimo privilegio: por defecto los jobs solo pueden leer el código.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior (ahorra minutos).
# En main no se cancela: ahí el CI es la primera etapa de un despliegue (cd.yml).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: backend

jobs:
  construccion:
    name: Construcción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 (con caché de dependencias npm)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json: si una dependencia no se resuelve, falla aquí.
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # Node no compila: se revisa la sintaxis y se cargan todos los módulos para comprobar que resuelven.
      - name: Construcción (sintaxis y carga de todos los módulos)
        run: npm run construir

  arquitectura:
    name: Reglas de arquitectura
    needs: construccion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 (con caché de dependencias npm)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # Funciones de aptitud del ADR-001 (backend/.dependency-cruiser.cjs). Falla si el dominio o la
      # aplicación importan infraestructura, o si alguien distinto de configuracion.js usa un adaptador.
      - name: Reglas de dependencias de la arquitectura hexagonal
        run: npm run arquitectura

      - name: Grafo de dependencias (reporte)
        if: always()
        run: |
          mkdir -p reportes
          npx depcruise src --config .dependency-cruiser.cjs --output-type html > reportes/arquitectura.html

      - name: Publicar reporte de arquitectura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-arquitectura
          path: backend/reportes/arquitectura.html
          if-no-files-found: ignore

  pruebas-unitarias:
    name: Pruebas unitarias y cobertura del dominio
    needs: construccion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 (con caché de dependencias npm)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # El umbral está en el propio comando (--test-coverage-lines=80 sobre src/dominio):
      # si la cobertura de líneas del dominio baja del 80 %, node --test termina con error.
      - name: Pruebas unitarias con umbral de cobertura del dominio (>= 80 %)
        run: npm run test:unitarias

      - name: Resumen de cobertura del dominio
        if: always()
        run: |
          if [ -f reportes/cobertura-dominio.lcov ]; then
            node -e "
              const lineas = require('fs').readFileSync('reportes/cobertura-dominio.lcov', 'utf8').split('\n');
              const suma = (p) => lineas.filter(l => l.startsWith(p)).reduce((t, l) => t + Number(l.slice(3)), 0);
              const total = suma('LF:'), cubiertas = suma('LH:');
              console.log('### Cobertura de líneas del dominio: ' + (100 * cubiertas / total).toFixed(2) + ' % (umbral 80 %)');
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes de pruebas unitarias y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-unitarias
          path: |
            backend/reportes/unitarias.xml
            backend/reportes/cobertura-dominio.lcov
          if-no-files-found: ignore

  pruebas-integracion:
    name: Pruebas de integración
    needs: construccion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 (con caché de dependencias npm)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # Adaptadores reales (SQLite con sql.js, QR) y la API completa por HTTP, incluidos los 401/403.
      - name: Pruebas de integración
        run: npm run test:integracion

      - name: Publicar reporte de pruebas de integración
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-integracion
          path: backend/reportes/integracion.xml
          if-no-files-found: ignore

  app-movil:
    name: App móvil (tipos y lint)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 (con caché de dependencias npm)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # El cliente no se despliega en un servidor (corre en el celular con Expo), pero debe compilar.
      - name: Revisión de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

  # ---------------------------------------------------------------------------------------------
  # DevSecOps: los cuatro controles son quality gates. Umbrales y justificación en
  # docs/adr/ADR-003-seguridad-del-pipeline.md; hallazgos y decisiones en docs/seguridad.md.
  # Los scripts de scripts/ son los mismos que se pueden correr a mano (con Docker).
  # ---------------------------------------------------------------------------------------------
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # subir los resultados a la pestaña Security > Code scanning
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # JavaScript no se compila: CodeQL analiza el backend (Node) y la app (TypeScript) directamente.
      # security-extended agrega consultas de seguridad más estrictas que el conjunto por defecto.
      - name: Iniciar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - 'backend/tests'

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: reportes/codeql
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      # CodeQL publica los hallazgos pero no detiene el pipeline: este paso aplica el umbral
      # (ningún hallazgo con security-severity >= 7.0 sin tratar).
      - name: Quality gate de SAST (ningún hallazgo alto o crítico sin tratar)
        run: scripts/umbral-sast.sh reportes/codeql/*.sarif

      - name: Publicar reporte de CodeQL
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-sast
          path: reportes/codeql/
          if-no-files-found: ignore

  sca:
    name: SCA (dependencias con Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Quality gate de SCA (ninguna vulnerabilidad alta o crítica con corrección)
        run: scripts/sca.sh

      - name: Publicar reporte de dependencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-sca
          path: reportes/trivy-dependencias.json
          if-no-files-found: ignore

  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      # fetch-depth: 0 descarga todo el historial: Gitleaks revisa cada commit, no solo los archivos actuales.
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Quality gate de secretos (cero secretos, incluido el historial)
        run: scripts/secretos.sh

      - name: Publicar reporte de secretos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-secretos
          path: reportes/gitleaks.json
          if-no-files-found: ignore

  imagen:
    name: Imagen Docker y escaneo (Trivy)
    needs: construccion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Con las variables de ejemplo, Compose debe poder armar la configuración completa.
      - name: Validar docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      - name: Construir la imagen
        run: docker build --build-arg VERSION="ci-${GITHUB_SHA::7}" -t wheels-backend:ci backend

      - name: Quality gate de la imagen (ninguna vulnerabilidad crítica con corrección)
        run: scripts/escaneo-imagen.sh wheels-backend:ci

      - name: Publicar reporte de la imagen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-imagen
          path: reportes/trivy-imagen.json
          if-no-files-found: ignore
